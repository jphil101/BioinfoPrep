[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "njswalig"
dynamic = ["version"]
description = "Needleman-Wunsch and Smith-Waterman pairwise sequence alignment, with the DP table"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "jphil101" }]
keywords = ["sequence alignment", "needleman-wunsch", "smith-waterman", "dynamic programming", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest", "biopython"]

[project.urls]
Homepage = "https://github.com/jphil101/BioinfoPrep/tree/main/njswalig"
Source = "https://github.com/jphil101/BioinfoPrep/tree/main/njswalig"
Issues = "https://github.com/jphil101/BioinfoPrep/issues"

[tool.hatch.version]
path = "src/njswalig/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
